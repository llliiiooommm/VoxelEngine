<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxelEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:rgba(0,0,0,.65);z-index:10}
.screen[hidden]{display:none}
.mc-btn{font-family:'Press Start 2P',monospace;font-size:12px;color:#e0e0e0;text-shadow:2px 2px 0 #383838;width:min(400px,86vw);height:44px;background:#6f6f6f;border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -3px 0 rgba(0,0,0,.4);cursor:pointer;margin-bottom:8px}
.mc-btn:hover{color:#ffffa0;border-color:#fff;background-color:#7c86c0}
.setting-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;width:100%;font-size:10px;color:#fff}
.setting-row label{width:180px;text-align:right}
.setting-row input[type=range]{flex:1;accent-color:#5f5}
.setting-row span{width:30px;text-align:right;color:#aaa}
.key-bind-row{display:flex;justify-content:space-between;width:100%;margin-bottom:8px;font-size:9px;color:#fff}
.key-bind-btn{background:#444;border:1px solid #888;color:#fff;padding:4px 8px;font-family:inherit;font-size:8px;cursor:pointer;min-width:80px}
.key-bind-btn.listening{background:#aa5;border-color:#ff0;color:#000}
.world-item{background:rgba(0,0,0,.4);padding:10px;margin-bottom:8px;border:2px solid #555;display:flex;justify-content:space-between;align-items:center;width:min(400px,86vw);cursor:pointer}
.world-item:hover{border-color:#fff;background:rgba(50,50,50,.6)}
.btn-del{background:#a33;border:2px solid #500;color:#fff;padding:4px 8px;font-family:inherit;font-size:8px;cursor:pointer}
.logo{font-size:clamp(30px,8.5vw,80px);letter-spacing:4px;color:#fff;text-shadow:4px 4px 0 #262626;margin-bottom:30px}
h2.mc-h{font-size:14px;margin-bottom:18px;text-shadow:2px 2px 0 #3f3f3f;font-weight:400;color:#fff}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3b2a1d;font-size:12px;color:#fff;z-index:100}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-overlay[hidden]{display:none}
.modal-box{background:#2a2a2a;border:3px solid #555;padding:24px;min-width:320px;text-align:center}
.modal-box h3{color:#fff;font-size:12px;margin-bottom:16px}
.modal-box input{width:100%;padding:8px;font-family:'Press Start 2P',monospace;font-size:10px;background:#1a1a1a;border:2px solid #444;color:#fff;margin-bottom:16px}
.modal-box input:focus{outline:none;border-color:#5f5}
.modal-buttons{display:flex;gap:8px;justify-content:center}
.modal-buttons button{width:auto;padding:8px 16px;font-size:10px}
</style>
</head>
<body>
<canvas id="view" aria-label="Игровой мир"></canvas>
<div class="hud" aria-hidden="true">
  <div id="water-tint"></div><div id="crosshair"></div><div id="debug" hidden></div>
  <div id="mode"></div><div id="item-name"></div><div id="hotbar"></div>
</div>

<section id="main-menu" class="screen">
  <h1 class="logo">VOXELENGINE</h1>
  <button class="mc-btn" id="btn-new-game">Новая игра</button>
  <button class="mc-btn" id="btn-select-world">Выбрать мир</button>
  <button class="mc-btn" id="btn-settings">Настройки</button>
  <button class="mc-btn" id="btn-exit">Выход</button>
</section>

<section id="worlds-screen" class="screen" hidden>
  <h2 class="mc-h">Выберите мир</h2>
  <div id="worlds-list" style="display:flex;flex-direction:column;align-items:center;width:100%;max-height:300px;overflow-y:auto"></div>
  <button class="mc-btn" id="btn-back-from-worlds">Назад</button>
</section>

<section id="settings-screen" class="screen" hidden>
  <h2 class="mc-h">Настройки</h2>
  <div id="settings-content" style="width:min(400px,86vw);display:flex;flex-direction:column;align-items:flex-start"></div>
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center">
    <button class="mc-btn" id="btn-save-settings" style="width:auto">Сохранить</button>
    <button class="mc-btn" id="btn-default-settings" style="width:auto">По умолчанию</button>
    <button class="mc-btn" id="btn-back-from-settings" style="width:auto">Назад</button>
  </div>
</section>

<section id="pause-screen" class="screen" hidden>
  <h2 class="mc-h">Пауза</h2>
  <button class="mc-btn" id="btn-resume">Вернуться к игре</button>
  <button class="mc-btn" id="btn-save-pause">Сохранить игру</button>
  <button class="mc-btn" id="btn-settings-pause">Настройки</button>
  <button class="mc-btn" id="btn-quit-to-menu">Выйти в меню</button>
</section>

<section id="inventory" class="screen" hidden>
  <div class="inv-panel" style="background:#c6c6c6;padding:14px;border:2px solid #000;color:#404040">
    <h2 style="font-size:11px;margin-bottom:10px">Творческий режим</h2>
    <div class="inv-grid" id="inv-grid" style="display:grid;grid-template-columns:repeat(9,40px);gap:2px"></div>
    <p style="font-size:7px;margin:10px 0">Нажмите на блок. E — закрыть.</p>
    <div class="inv-grid" id="inv-hotbar" style="display:grid;grid-template-columns:repeat(9,40px);gap:2px"></div>
  </div>
</section>

<div id="name-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3>Название нового мира</h3>
    <input type="text" id="world-name-input" placeholder="Введите имя мира" maxlength="30">
    <div class="modal-buttons">
      <button class="mc-btn" id="btn-confirm-name">Создать</button>
      <button class="mc-btn" id="btn-cancel-name">Отмена</button>
    </div>
  </div>
</div>

<div id="loading">Генерация мира…</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
